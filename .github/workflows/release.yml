name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check application version
        id: version
        shell: bash
        run: |
          cargo_version=$(awk -F'"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$cargo_version" = "$tauri_version" || {
            echo "Cargo.toml and tauri.conf.json versions differ" >&2
            exit 1
          }

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$cargo_version" || {
              echo "Tag must be v$cargo_version" >&2
              exit 1
            }
            echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          else
            echo "version=${cargo_version}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-15
            bundles: dmg
          - platform: windows-x64
            os: windows-latest
            bundles: nsis
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: appimage,deb

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build ${{ matrix.platform }} bundles
        working-directory: src-tauri
        shell: bash
        run: cargo tauri build --bundles "${{ matrix.bundles }}"

      - name: Collect release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          copy_one() {
            local directory="$1" pattern="$2" destination="$3"
            local files=()
            while IFS= read -r -d '' file; do files+=("$file"); done < <(find "$directory" -maxdepth 1 -type f -name "$pattern" -print0)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected exactly one $pattern in $directory; found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "release-artifacts/$destination"
          }
          case "$PLATFORM" in
            macos-aarch64)
              copy_one src-tauri/target/release/bundle/dmg '*.dmg' "SJTU-LaTeX-Migrator_${VERSION}_macOS-Apple-Silicon.dmg"
              ;;
            windows-x64)
              copy_one src-tauri/target/release/bundle/nsis '*.exe' "SJTU-LaTeX-Migrator_${VERSION}_Windows-x64-Setup.exe"
              ;;
            linux-x64)
              copy_one src-tauri/target/release/bundle/appimage '*.AppImage' "SJTU-LaTeX-Migrator_${VERSION}_Linux-x64.AppImage"
              copy_one src-tauri/target/release/bundle/deb '*.deb' "SJTU-LaTeX-Migrator_${VERSION}_Linux-x64.deb"
              ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          ls -lh release-artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SJTU-LaTeX-Migrator_${{ needs.version.outputs.version }}_${{ matrix.platform }}
          path: release-artifacts
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version, build]
    if: github.ref_type == 'tag' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SJTU-LaTeX-Migrator_${{ needs.version.outputs.version }}_*
          path: release-artifacts
          merge-multiple: true

      - name: Create checksum manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum -- *.dmg *.exe *.AppImage *.deb > "SHA256SUMS_${VERSION}.txt")
          ls -lh release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SJTU LaTeX Migrator ${VERSION}" \
            --notes $'## 下载安装\n\n在下方 **Assets** 中选择适合你电脑的安装包（文件名中还包含版本号）：\n\n- **Mac（Apple 芯片 M1、M2、M3 等）**：下载 `macOS-Apple-Silicon.dmg`，打开后将应用拖入「应用程序」。\n- **Windows（64 位 Intel / AMD）**：下载 `Windows-x64-Setup.exe`，双击安装。\n- **Ubuntu / Debian（64 位）**：下载 `Linux-x64.deb`。\n- **其他 Linux（64 位 Intel / AMD）**：下载 `Linux-x64.AppImage`，添加执行权限后运行。\n\n其他架构可以尝试[从源码构建](https://github.com/xpluspro/SJTU-LaTeX-Migrator#从源码构建)。\n\n> [!WARNING]\n> 安装包尚未签名，macOS 版本也未经公证。首次打开时系统可能阻止运行或显示安全警告。请确认安装包来自本项目的 Releases 页面，遇到“已损坏”提示时请参阅 README 中的处理方法。\n\n[查看使用说明](https://github.com/xpluspro/SJTU-LaTeX-Migrator#开始迁移)' \
            --generate-notes \
            release-artifacts/*
