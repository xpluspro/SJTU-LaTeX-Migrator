[package]
name = "sjtu-latex-migrator"
version = "0.2.0"
description = "Migrate SJTU LaTeX projects between Overleaf-compatible services"
authors = ["SJTU LaTeX Migrator"]
edition = "2021"

[lib]
name = "sjtu_latex_migrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
url = "2"
regex = "1"
html-escape = "0.2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
